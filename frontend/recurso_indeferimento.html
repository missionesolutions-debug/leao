<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Petição de Recurso ao Indeferimento</title>
  <link rel="stylesheet" href="assets/css/dashlite.min.css">
  <script src="config.js"></script>
</head>
<body>
  <a href="marca" style="position: absolute; top: 20px; left: 20px; text-decoration: none; font-size: 2rem;" title="Voltar para Marcas">
    &#8592;
  </a>
  <div class="container" style="max-width:600px; margin-top:40px;">
    <h2>Petição de Recurso ao Indeferimento</h2>
    <p class="mb-4">Gerencie e automatize o conteúdo administrativo de marcas de forma simples e eficiente.</p>
    <form id="recursoIndeferimentoForm">
      <div class="form-group">
        <label for="numero_processo">Número do Processo</label>
        <input type="text" id="numero_processo" name="numero_processo" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="marca">Marca</label>
        <input type="text" id="marca" name="marca" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="classe_nice">Classe Nice</label>
        <input type="text" id="classe_nice" name="classe_nice" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="especificacao">Especificação</label>
        <input type="text" id="especificacao" name="especificacao" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="titular">Titular</label>
        <input type="text" id="titular" name="titular" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="rpi_indeferimento">RPI do Indeferimento</label>
        <input type="text" id="rpi_indeferimento" name="rpi_indeferimento" class="form-control">
      </div>
      <div class="form-group">
        <label for="data_indeferimento">Data Indeferimento</label>
        <input type="text" id="data_indeferimento" name="data_indeferimento" class="form-control" placeholder="dd/mm/aaaa">
      </div>
      <div class="form-group">
        <label for="base_legal_indeferimento">Base Legal do Indeferimento</label>
        <textarea id="base_legal_indeferimento" name="base_legal_indeferimento" class="form-control"></textarea>
      </div>
      <div class="form-group">
        <label for="motivo_indeferimento">Motivo do Indeferimento</label>
        <textarea id="motivo_indeferimento" name="motivo_indeferimento" class="form-control"></textarea>
      </div>
      <div class="form-group">
        <label for="anterioridade_citada">Anterioridade Citada</label>
        <input type="text" id="anterioridade_citada" name="anterioridade_citada" class="form-control">
      </div>
      <div class="form-group">
        <label for="conjunto_marcario">Conjunto Marcário</label>
        <input type="text" id="conjunto_marcario" name="conjunto_marcario" class="form-control">
      </div>
      <div class="form-group">
        <label for="elementos_distintivos">Elementos Distintivos</label>
        <input type="text" id="elementos_distintivos" name="elementos_distintivos" class="form-control">
      </div>
      <div class="form-group">
        <label for="precedentes_distintividade">Precedentes de Distintividade</label>
        <input type="text" id="precedentes_distintividade" name="precedentes_distintividade" class="form-control">
      </div>
      <div class="form-group">
        <label for="registros_similares">Registros Similares</label>
        <input type="text" id="registros_similares" name="registros_similares" class="form-control">
      </div>
      <div class="form-group">
        <label for="segmento_mercado">Segmento de Mercado</label>
        <input type="text" id="segmento_mercado" name="segmento_mercado" class="form-control">
      </div>
      <div class="form-group">
        <label for="publico_alvo_distinto">Público-Alvo Distinto</label>
        <input type="text" id="publico_alvo_distinto" name="publico_alvo_distinto" class="form-control">
      </div>
      <div class="form-group">
        <label for="outros_argumentos">Outros Argumentos</label>
        <textarea id="outros_argumentos" name="outros_argumentos" class="form-control"></textarea>
      </div>
      <button type="submit" class="btn btn-primary mt-3">Enviar</button>
    </form>
  </div>
  <script>
    const API_URL = window.APP_CONFIG.API_URL;
    
    // CONFIGURAÇÃO TEMPORÁRIA PARA TESTES
    // Definir um token de teste se não existir
    if (!localStorage.getItem('token')) {
      localStorage.setItem('token', 'test-token-for-development');
      console.log('Token de teste definido no localStorage');
    }
    
    // Função simples para loading
    function mostrarLoadingSimples() {
      const botao = document.querySelector('button[type="submit"]');
      botao.disabled = true;
      botao.innerHTML = '⏳ Processando...';
    }
    
    function ocultarLoadingSimples() {
      const botao = document.querySelector('button[type="submit"]');
      botao.disabled = false;
      botao.innerHTML = 'Enviar';
    }
    
    document.getElementById('recursoIndeferimentoForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Mostrar loading simples
      mostrarLoadingSimples();
      
      const formData = new FormData(this);
      const formFields = Object.fromEntries(formData.entries());
      
      // Mapear campos do formulário para o schema esperado pela API
      const data = {
        processo_numero: formFields.numero_processo || '',
        processo_marca: formFields.marca || '',
        processo_classe: formFields.classe_nice || '',
        processo_especificacao: formFields.especificacao || '',
        processo_titular: formFields.titular || '',
        data_indeferimento: formFields.data_indeferimento || '',
        motivo_indeferimento: formFields.motivo_indeferimento || '',
        artigo_legal: formFields.base_legal_indeferimento || '',
        fundamentacao_inpi: formFields.base_legal_indeferimento || '',
        marca_colidente: formFields.anterioridade_citada || '',
        processo_colidente: '',
        titular_colidente: '',
        contra_argumentacao: formFields.outros_argumentos || '',
        distintividade: formFields.elementos_distintivos || '',
        ausencia_confundibilidade: formFields.conjunto_marcario || '',
        coexistencia_pacifica: formFields.publico_alvo_distinto || '',
        precedentes: formFields.precedentes_distintividade || '',
        doutrina: ''
      };
      
      fetch(`${API_URL}/peticoes/recurso-indeferimento`, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${localStorage.getItem('token')}`
        },
        body: JSON.stringify(data)
      })
      .then(resp => {
        if (!resp.ok) {
          throw new Error(`HTTP error! status: ${resp.status}`);
        }
        return resp.json();
      })
      .then(resp => {
        ocultarLoadingSimples();
        
        // Salvar dados da petição para edição
        dadosItemAtual = resp;
        tipoItemAtual = 'recurso_indeferimento';
        
        // Mostrar modal de edição em vez de redirecionar
        abrirModalEdicaoAvancada('recurso_indeferimento', resp.id);
      })
      .catch(error => {
        ocultarLoadingSimples();
        console.error('Erro ao gerar petição:', error);
        alert('Erro ao gerar petição: ' + error.message);
      });
    });
  </script>
  
  <script src="scripts/historico-chat.js"></script>
</body>
</html>
