<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Login</title>
  <link rel="stylesheet" href="assets/css/dashlite.min.css">
</head>
<body class="nk-body bg-lighter npc-default has-sidebar">
  <div class="container" style="max-width:400px; margin-top:80px;">
    <h2>Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary mt-3" onclick="window.location.href='menu.html'">Entrar</button>
      <button type="button" class="btn btn-secondary mt-2" onclick="window.location.href='cadastro.html'">Cadastrar</button>
    </form>
  </div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/scripts.js"></script>
</body>
</html>
