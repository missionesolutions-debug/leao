    .user-card {
      border: 1px solid #e5e9f2;
      border-radius: 6px;

      transition: all 0.3s ease;

    .user-info {

      font-size: 0.9rem;

    .user-actions .btn {

    /* Estilos do Modal */
    .modal-bg {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    
    .modal-bg.active {
      display: flex;
    }
    
    .modal-content {
      background: #fff;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px 16px;
      border-bottom: 1px solid #eee;
    }
    
    .modal-header h4 {
      margin: 0;
      color: #333;
      font-size: 1.25rem;
    }
    
    .btn-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #999;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .btn-close:hover {
      color: #333;
    }
    
    .modal-body {
      padding: 20px 24px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }
    
    .optional {
      font-weight: normal;
      color: #666;
      font-size: 0.9em;
    }
    
    .form-control {
      width: 100%;
      padding: 12px;
      border: 2px solid #e1e5e9;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    
    .form-control:focus {
      outline: none;
      border-color: #007bff;
    }
    
    .form-text {
      display: block;
      margin-top: 6px;
      color: #666;
      font-size: 0.85em;
    }
    
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 16px 24px 20px;
      border-top: 1px solid #eee;
    }
    
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    
    .btn-secondary {
      background: #6c757d;
      color: white;
    }
    
    .btn-secondary:hover {
      background: #5a6268;
    }
    
    .btn-primary {
      background: #007bff;
      color: white;
    }
    
    .btn-primary:hover {
      background: #0056b3;
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>

  <!-- Modal de Edição de Usuário -->
  <div id="modalEdicaoUsuario" class="modal-bg">
    <div class="modal-content">
      <div class="modal-header">
        <h4>✏️ Editar Usuário</h4>
        <button type="button" class="btn-close" onclick="fecharModalEdicao()">&times;</button>
      </div>
      
      <div class="modal-body">
        <input type="hidden" id="editUserId">
        
        <div class="form-group">
          <label for="editUsername">👤 Nome do Usuário</label>
          <input type="text" id="editUsername" class="form-control" placeholder="Digite o nome completo" required>
        </div>
        
        <div class="form-group">
          <label for="editEmail">📧 Email</label>
          <input type="email" id="editEmail" class="form-control" placeholder="exemplo@email.com" required>
        </div>
        
        <div class="form-group">
          <label for="editPassword">🔒 Nova Senha <span class="optional">(opcional)</span></label>
          <input type="password" id="editPassword" class="form-control" placeholder="Deixe vazio para manter a senha atual">
          <small class="form-text">Deixe em branco se não quiser alterar a senha.</small>
        </div>
      </div>
      
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="fecharModalEdicao()">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="salvarEdicaoUsuario()">💾 Salvar Alterações</button>
      </div>
    </div>
  </div>

  <script>
    // Variáveis globais que serão definidas após carregamento do config
    let API_URL;
    
    // Função para inicializar configuração
    function inicializarConfig() {
      API_URL = window.APP_CONFIG ? window.APP_CONFIG.API_URL : 'http://localhost:8000';
      console.log('Perfil - API_URL definido:', API_URL);
      console.log('Perfil - APP_CONFIG disponível:', !!window.APP_CONFIG);
      console.log('Perfil - Ambiente:', window.location.hostname);
      return true;
    }

    function updateStatus(message, isError = false) {
      const status = document.getElementById('status');
      if (status) {
        status.textContent = message;
        status.className = isError ? 'status error' : 'status';
      }
    }

    function listarUsuarios() {
      // Verificar se API_URL está definido
      if (!API_URL) {
        console.error('API_URL não está definido!');
        updateStatus('Erro: Configuração não carregada. Tente recarregar a página.', true);
        return;
      }
      
      console.log('Listando usuários com API_URL:', API_URL);
      updateStatus('Carregando usuários...');
      
      fetch(`${API_URL}/usuarios/`)
        .then(response => {
          if (!response.ok) {
            throw new Error(`Erro: ${response.status}`);
          }
          return response.json();
        })
        .then(usuarios => {
          updateStatus(`${usuarios.length} usuários encontrados`);
          
          const container = document.getElementById('usuariosList');
          container.innerHTML = '';
          
          if (usuarios.length === 0) {
            container.innerHTML = '<p>Nenhum usuário encontrado.</p>';
            return;
          }
          
          // Ordenar usuários por ID crescente
          usuarios.sort((a, b) => a.id - b.id);
          
          usuarios.forEach(usuario => {
            const userDiv = document.createElement('div');
            userDiv.className = 'user-card';
            userDiv.innerHTML = `
              <div class="user-info">
                <div class="user-details">
                  <h5>${usuario.username || 'Sem nome'}</h5>
                  <p>📧 ${usuario.email}</p>
                  <p><small class="text-muted">ID: ${usuario.id}</small></p>
                </div>
                <div class="user-actions">
                  <button class="btn btn-sm btn-outline-primary" onclick="editarUsuario(${usuario.id}, '${usuario.username}', '${usuario.email}')">
                    <em class="icon ni ni-edit"></em> Editar
                  </button>
                  <button class="btn btn-sm btn-outline-danger" onclick="excluirUsuario(${usuario.id}, '${usuario.username || usuario.email}')">
                    <em class="icon ni ni-trash"></em> Excluir
                  </button>
                </div>
              </div>
            `;
            container.appendChild(userDiv);
          });
        })
        .catch(error => {
          updateStatus(`Erro ao carregar usuários: ${error.message}`, true);
        });
    }

    function editarUsuario(id, username, email) {
      // Preencher o modal com os dados atuais
      document.getElementById('editUserId').value = id;
      document.getElementById('editUsername').value = username || '';
      document.getElementById('editEmail').value = email || '';
      document.getElementById('editPassword').value = '';
      
      // Mostrar o modal
      document.getElementById('modalEdicaoUsuario').classList.add('active');
    }

    function fecharModalEdicao() {
      document.getElementById('modalEdicaoUsuario').classList.remove('active');
      // Limpar os campos
      document.getElementById('editUserId').value = '';
      document.getElementById('editUsername').value = '';
      document.getElementById('editEmail').value = '';
      document.getElementById('editPassword').value = '';
    }

    function salvarEdicaoUsuario() {
      const id = document.getElementById('editUserId').value;
      const username = document.getElementById('editUsername').value.trim();
      const email = document.getElementById('editEmail').value.trim();
      const password = document.getElementById('editPassword').value.trim();
      
      // Validações básicas
      if (!username || !email) {
        alert('❌ Nome e email são obrigatórios!');
        return;
      }
      
      if (!email.includes('@')) {
        alert('❌ Email deve ser válido!');
        return;
      }
      
      // Mostrar loading
      const botaoSalvar = document.querySelector('#modalEdicaoUsuario .btn-primary');
      const textoOriginal = botaoSalvar.innerHTML;
      botaoSalvar.disabled = true;
      botaoSalvar.innerHTML = '⏳ Salvando...';
      
      // Preparar dados para envio
      const dados = {
        username: username,
        email: email
      };
      
      // Adicionar senha apenas se foi preenchida
      if (password) {
        dados.password = password;
      }
      
      fetch(`${API_URL}/usuarios/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      })
      .then(response => {
        if (response.ok) {
          // Restaurar botão
          botaoSalvar.disabled = false;
          botaoSalvar.innerHTML = textoOriginal;
          
          // Fechar modal e recarregar
          fecharModalEdicao();
          
          // Mostrar feedback
          const feedback = document.createElement('div');
          feedback.style.cssText = 'position: fixed; top: 20px; right: 20px; background: #28a745; color: white; padding: 10px 20px; border-radius: 5px; z-index: 9999;';
          feedback.textContent = '✅ Usuário atualizado com sucesso!';
          document.body.appendChild(feedback);
          setTimeout(() => feedback.remove(), 3000);
          
          // Recarregar lista
          listarUsuarios();
        } else {
          throw new Error('Erro na resposta da API');
        }
      })
      .catch(error => {
        // Restaurar botão
        botaoSalvar.disabled = false;
        botaoSalvar.innerHTML = textoOriginal;
        
        alert('❌ Erro ao atualizar usuário: ' + error.message);
      });
    }

    function excluirUsuario(id, nome) {
      if (confirm(`Tem certeza que deseja excluir o usuário "${nome}"?`)) {
        fetch(`${API_URL}/usuarios/${id}`, { method: 'DELETE' })
          .then(response => {
            if (response.ok) {
              alert('✅ Usuário excluído com sucesso!');
              listarUsuarios();
            } else {
              alert('❌ Erro ao excluir usuário');
            }
          })
          .catch(error => {
            alert('❌ Erro de conexão: ' + error.message);
          });
      }
    }

    // Aguardar o DOM e APP_CONFIG estarem carregados
    function inicializar() {
      if (!window.APP_CONFIG) {
        console.log('Perfil - Aguardando APP_CONFIG...');
        setTimeout(inicializar, 100);
        return;
      }
      
      console.log('Perfil - APP_CONFIG carregado:', window.APP_CONFIG);
      
      // Inicializar configurações
      if (!inicializarConfig()) {
        console.error('Perfil - Falha ao inicializar configurações');
        return;
      }
      
      // Agora sim, carregar usuários
      listarUsuarios();
      
      // Configurar event listeners dos modais
      document.getElementById('modalEdicaoUsuario').addEventListener('click', function(e) {
        if (e.target === this) {
          fecharModalEdicao();
        }
      });

      // Fechar modal com tecla Escape
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && document.getElementById('modalEdicaoUsuario').classList.contains('active')) {
          fecharModalEdicao();
        }
      });
    }
    
    // Aguardar carregamento completo do DOM e configuração
    function aguardarConfigEInicializar() {
      if (window.APP_CONFIG) {
        inicializarConfig();
        inicializar();
      } else {
        // Tentar novamente após um pequeno delay
        setTimeout(aguardarConfigEInicializar, 50);
      }
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener("DOMContentLoaded", aguardarConfigEInicializar);
    } else {
      aguardarConfigEInicializar();
    }
  </script>
