    <script>
      // Variáveis globais que serão definidas após carregamento do config
      let API_URL;
      const historico = [];

      // Função para inicializar configuração
      function inicializarConfig() {
        API_URL = window.APP_CONFIG
          ? window.APP_CONFIG.API_URL
          : "http://localhost:8000";
        console.log("Oráculo - API_URL definido:", API_URL);
        console.log("Oráculo - APP_CONFIG disponível:", !!window.APP_CONFIG);
        return true;
      }

      // Função simples para loading
      function mostrarLoadingSimples() {
        const botao = document.querySelector('button[type="submit"]');
        botao.disabled = true;
        botao.innerHTML = "Consultando...";
      }

      function ocultarLoadingSimples() {
        const botao = document.querySelector('button[type="submit"]');
        botao.disabled = false;
        botao.innerHTML = "Consultar";
      }

      document.addEventListener("DOMContentLoaded", function () {
        const oracleForm = document.getElementById("oracleForm");
        const oracleResposta = document.getElementById("oracleResposta");
        const historicoPerguntas =
          document.getElementById("historicoPerguntas");

        oracleForm.addEventListener("submit", function (e) {
          e.preventDefault();

          // Mostrar loading simples
          mostrarLoadingSimples();

          const pergunta = document.getElementById("oraclePergunta").value;
          consultarOracle(pergunta, function (resposta) {
            ocultarLoadingSimples();
            oracleResposta.innerHTML = `<div class="alert alert-info">${resposta}</div>`;
            historico.unshift({ pergunta, resposta });
            if (historico.length > 10) historico.pop(); // Limita a 10 itens
            atualizarHistorico();
            document.getElementById("oraclePergunta").value = ""; // Limpar campo
          });
        });

        function atualizarHistorico() {
          historicoPerguntas.innerHTML = "";
          historico.forEach((item, index) => {
            const card = document.createElement("div");
            card.className = "card mb-3";
            card.innerHTML = `
            <div class="card-body">
              <h6 class="card-subtitle mb-2 text-muted">Consulta #${
                historico.length - index
              }</h6>
              <p class="card-text"><strong>❓ Pergunta:</strong> ${
                item.pergunta
              }</p>
              <p class="card-text"><strong>🤖 Resposta:</strong> ${
                item.resposta
              }</p>
            </div>
          `;
            historicoPerguntas.appendChild(card);
          });
        }
      });

      function consultarOracle(pergunta, callback) {
        // Verificar se API_URL está definido
        if (!API_URL) {
          console.error("API_URL não está definido!");
          callback(
            "Erro: Configuração não carregada. Tente recarregar a página."
          );
          return;
        }

        console.log("Consultando oráculo com API_URL:", API_URL);

        fetch(`${API_URL}/oracle/query`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ query: pergunta }),
        })
          .then((resp) => {
            if (!resp.ok) {
              throw new Error(`HTTP error! status: ${resp.status}`);
            }
            return resp.json();
          })
          .then((data) => {
            if (data.response) {
              callback(data.response);
            } else {
              callback(data.detail || "Erro na consulta Oracle");
            }
          })
          .catch((error) => {
            console.error("Erro ao consultar oráculo:", error);
            ocultarLoadingSimples();
            callback("Erro de conexão com o servidor: " + error.message);
          });
      }

      // Aguardar o DOM e APP_CONFIG estarem carregados
      function inicializar() {
        if (!window.APP_CONFIG) {
          console.log("Oráculo - Aguardando APP_CONFIG...");
          setTimeout(inicializar, 100);
          return;
        }

        console.log("Oráculo - APP_CONFIG carregado:", window.APP_CONFIG);

        // Inicializar configurações
        if (!inicializarConfig()) {
          console.error("Oráculo - Falha ao inicializar configurações");
          return;
        }

        console.log("Oráculo - Inicialização completa!");
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", inicializar);
      } else {
        inicializar();
      }
    </script>
