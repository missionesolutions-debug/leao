# Configurações de Segurança para Servidor Web
# Use estas configurações no seu nginx/apache

# Bloquear acesso a arquivos sensíveis
location ~ /\.(env|git|htaccess|htpasswd) {
    deny all;
    return 403;
}

# Bloquear tentativas de exploração comuns
location ~ /(admin|wp-admin|phpmyadmin|config|backup|database)/ {
    deny all;
    return 403;
}

# Rate limiting para APIs
location /api/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass http://localhost:8000;
}

# Headers de segurança
add_header X-Frame-Options DENY;
add_header X-Content-Type-Options nosniff;
add_header X-XSS-Protection "1; mode=block";
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'";

# Bloquear user agents suspeitos
if ($http_user_agent ~* (bot|crawler|scanner|exploit)) {
    return 403;
}